services:
  auth-service:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: auth-container
    ports:
      - "${PORT_HOST}:${PORT_CONTENEDOR}"        
    volumes:
      - .:/app
      - /app/node_modules       
    env_file:
      - .env                     
    environment:
      - NODE_ENV=${NODE_ENV}